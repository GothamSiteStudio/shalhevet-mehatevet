      (function () {
        // Keep visitors who followed an old in-page link on the matching section of the new page.

          '#services': '#offer',
          '#pricing': '#programs',
          '#process': '#how',
          '#faq': '#faq',
          '#contact': '#contact'
        };
        location.replace('https://shalhevetmehatevet.com/he' + (map[location.hash] || ''));
      })();
    </script>
